name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-sanity:
    name: Source sanity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Check Pinkes source markers
        run: |
          set -eu
          test -f PINKES.md
          grep -q '^Name=Pinkes$' app/assets/application.ini
          grep -q '^Vendor=Pinkes$' app/assets/application.ini
          ! grep -q '^\[AppUpdate\]' app/assets/application.ini
          grep -q "CLIENT_NAME: 'Pinkes'" resource/config.mjs
          grep -q "ID: 'zotero'" resource/config.mjs
          grep -q 'extensions.zotero.sync.enabled", false' defaults/preferences/zotero.js
          grep -q 'httpServer.port", 23120' defaults/preferences/zotero.js

      - name: Check no generated artifacts
        run: |
          set -eu
          if git ls-files | grep -E '(^|/)(omni\.ja|.*\.deb|.*\.zip)$'; then
            echo "Generated build artifact committed to source tree" >&2
            exit 1
          fi

      - name: Check whitespace
        run: git diff --check
